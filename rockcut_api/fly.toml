app = 'rockcut-api'
primary_region = 'dfw'

[build]

[env]
  PHX_HOST = "rockcut-api.fly.dev"
  PORT = "4000"
  DATABASE_PATH = "/data/rockcut_api.db"

[mounts]
  source = "rockcut_data"
  destination = "/data"
  # Daily volume snapshots, retained 14 days (D28)
  snapshot_retention = 14

[http_service]
  internal_port = 4000
  force_https = true
  # Keep one machine always on (D28): the D22 reminder GenServer and the
  # fire-and-forget push/email Tasks only run while the machine is up. SQLite on a
  # single volume also requires exactly one machine (`fly scale count 1`).
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
