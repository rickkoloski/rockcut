# Rockcut Element Catalog (Layer 2)
# Stable element references per page, from Playwright CLI snapshots.
# Last updated: 2026-02-23 (cycle 1 — brands page fully explored, locators added)

# NOTE: Element refs (e12, e38, etc.) are session-scoped and change on every snapshot.
# This catalog records STABLE selectors (roles, names, testids) not ephemeral refs.
#
# LOCATOR CONVENTION:
# Each element includes a `locator` field — the Playwright locator expression
# auto-generated by the CLI or derived from observed CLI output. These are
# copy-paste-ready for .spec.ts files and represent the canonical access path.
#
# Locator priority (CLI follows this automatically):
#   1. data-testid  →  page.getByTestId('...')
#   2. role + name  →  page.getByRole('button', { name: '...' })
#   3. chained      →  page.getByRole('listitem').filter({ hasText: '...' }).getByRole('button')

login_page:
  route: "/login"
  snapshot_source: "page-2026-02-22T14-36-40-294Z.yml"
  elements:
    logo:
      selector: 'img[alt="Rockcut Brewing Co"]'
      role: "img"
      name: "Rockcut Brewing Co"
      locator: "page.getByRole('img', { name: 'Rockcut Brewing Co' })"
    heading:
      role: "heading"
      name: "Sign in to continue"
      level: 6
      locator: "page.getByRole('heading', { name: 'Sign in to continue' })"
    email_field:
      role: "textbox"
      name: "Email"
      data_testid: "login-email"
      locator: "page.getByRole('textbox', { name: 'Email' })"
      locator_alt: "page.getByTestId('login-email')"
    password_field:
      role: "textbox"
      name: "Password"
      data_testid: "login-password"
      locator: "page.getByRole('textbox', { name: 'Password' })"
      locator_alt: "page.getByTestId('login-password')"
    submit_button:
      role: "button"
      name: "Sign In"
      data_testid: "login-submit"
      locator: "page.getByTestId('login-submit')"
      locator_alt: "page.getByRole('button', { name: 'Sign In' })"
      notes: "CLI prefers testid when available"

app_shell:
  description: "Shared across all authenticated pages"
  snapshot_source: "page-2026-02-22T14-37-00-550Z.yml"
  elements:
    user_name:
      role: "paragraph"
      content: "Matt"
      notes: "Displays current user's name — dynamic, content changes per user"
    logout_button:
      role: "button"
      name: "Logout"
      data_testid: "logout-button"
      locator: "page.getByTestId('logout-button')"
      locator_alt: "page.getByRole('button', { name: 'Logout' })"
    nav_home:
      role: "button"
      name: "Home"
      locator: "page.getByRole('button', { name: 'Home' })"
    nav_brands:
      role: "button"
      name: "Brands & Recipes"
      locator: "page.getByRole('button', { name: 'Brands & Recipes' })"
    nav_ingredients:
      role: "button"
      name: "Ingredient Library"
      locator: "page.getByRole('button', { name: 'Ingredient Library' })"
    nav_batches:
      role: "button"
      name: "Batches"
      locator: "page.getByRole('button', { name: 'Batches' })"
    nav_settings:
      role: "button"
      name: "Settings"
      locator: "page.getByRole('button', { name: 'Settings' })"
    nav_users:
      role: "button"
      name: "Users"
      admin_only: true
      locator: "page.getByRole('button', { name: 'Users' })"

brands_list:
  route: "/brands"
  snapshot_source: "page-2026-02-23T16-26-56-401Z.yml"
  elements:
    page_heading:
      role: "heading"
      name: "Brands & Recipes"
      level: 4
      locator: "page.getByRole('heading', { name: 'Brands & Recipes' })"
    breadcrumb_home:
      role: "link"
      name: "Home"
      locator: "page.getByRole('link', { name: 'Home' })"
    add_button:
      role: "button"
      name: "Add Brand"
      locator: "page.getByRole('button', { name: 'Add Brand' })"
    search_field:
      role: "textbox"
      name: "Search..."
      locator: "page.getByRole('textbox', { name: 'Search...' })"
    column_visibility_toggle:
      role: "button"
      name: "Toggle column visibility"
      locator: "page.getByRole('button', { name: 'Toggle column visibility' })"
    grid:
      role: "grid"
      locator: "page.getByRole('grid')"
      columns:
        - name: "Name"
          locator: "page.getByRole('columnheader', { name: 'Name' })"
        - name: "Style"
          locator: "page.getByRole('columnheader', { name: 'Style' })"
        - name: "ABV"
          locator: "page.getByRole('columnheader', { name: 'ABV' })"
        - name: "IBU"
          locator: "page.getByRole('columnheader', { name: 'IBU' })"
        - name: "Status"
          locator: "page.getByRole('columnheader', { name: 'Status' })"
      row_by_name:
        pattern: "page.getByRole('row', { name: /.*{brand_name}.*/ })"
        example: "page.getByRole('row', { name: /.*Rockcut IPA.*/ })"
      cell_by_row_and_column:
        pattern: "page.getByRole('row', { name: /.*{brand}.*/ }).getByRole('gridcell').nth({col_index})"
        notes: "Column index: 0=Name, 1=Style, 2=ABV, 3=IBU, 4=Status"
      cell_by_name:
        example: "page.getByRole('gridcell', { name: 'Rockcut IPA' })"
        notes: "CLI generates this for click — works when cell text is unique"
    pagination:
      rows_per_page:
        role: "combobox"
        name: "Rows per page: 100"
        locator: "page.getByRole('combobox', { name: 'Rows per page:' })"
      page_info:
        role: "paragraph"
        pattern: "1–N of M"
        locator: "page.getByText(/\\d+–\\d+ of \\d+/)"
    empty_state:
      text: "No rows"
      locator: "page.getByText('No rows')"
      notes: "Visible when search/filter yields 0 results"
  data_testids_present: []
  data_testids_needed:
    - "brands-page (root)"
    - "brands-search (search field)"
    - "add-brand-btn (add button)"
    - "brand-row-{id} (grid rows)"

brands_add_dialog:
  description: "Add Brand dialog (opened from BrandsList via Add Brand button)"
  snapshot_source: "page-2026-02-23T16-28-07-598Z.yml"
  elements:
    dialog:
      role: "dialog"
      name: "Add Brand"
      locator: "page.getByRole('dialog', { name: 'Add Brand' })"
    title:
      role: "heading"
      name: "Add Brand"
      level: 2
      locator: "page.getByRole('heading', { name: 'Add Brand' })"
    name_field:
      role: "textbox"
      name: "Name"
      required: true
      locator: "page.getByRole('textbox', { name: 'Name' })"
    style_field:
      role: "textbox"
      name: "Style"
      locator: "page.getByRole('textbox', { name: 'Style' })"
    description_field:
      role: "textbox"
      name: "Description"
      locator: "page.getByRole('textbox', { name: 'Description' })"
    target_abv_field:
      role: "spinbutton"
      name: "Target ABV"
      locator: "page.getByRole('spinbutton', { name: 'Target ABV' })"
      notes: "Numeric input — role is spinbutton, not textbox"
    target_ibu_field:
      role: "spinbutton"
      name: "Target IBU"
      locator: "page.getByRole('spinbutton', { name: 'Target IBU' })"
    target_srm_field:
      role: "spinbutton"
      name: "Target SRM"
      locator: "page.getByRole('spinbutton', { name: 'Target SRM' })"
    status_field:
      role: "combobox"
      name: "Status Active"
      default_value: "Active"
      options: ["Active", "Seasonal", "Retired"]
      locator: "page.getByRole('combobox', { name: 'Status' })"
      notes: "Name includes current value in a11y tree ('Status Active'), but CLI targets by label"
    cancel_button:
      role: "button"
      name: "Cancel"
      locator: "page.getByRole('button', { name: 'Cancel' })"
    save_button:
      role: "button"
      name: "Save"
      locator: "page.getByRole('button', { name: 'Save' })"
  data_testids_present: []
  data_testids_needed:
    - "brand-form-dialog (dialog root)"
    - "brand-field-name (name input)"
    - "brand-field-style (style input)"
    - "brand-field-status (status select)"

brands_column_visibility_panel:
  description: "Column visibility popover (opened from toggle button)"
  snapshot_source: "page-2026-02-23T16-29-15-827Z.yml"
  elements:
    panel_heading:
      role: "heading"
      name: "Columns"
      level: 6
      locator: "page.getByRole('heading', { name: 'Columns' })"
    show_all_button:
      role: "button"
      name: "Show All"
      locator: "page.getByRole('button', { name: 'Show All' })"
    column_toggles:
      description: "Each column has a listitem with text label + eye icon toggle button"
      toggle_by_name:
        pattern: "page.getByRole('listitem').filter({ hasText: '{column_name}' }).getByRole('button')"
        examples:
          hide_style: "page.getByRole('listitem').filter({ hasText: 'Style' }).getByRole('button')"
          hide_abv: "page.getByRole('listitem').filter({ hasText: 'ABV' }).getByRole('button')"
        notes: "CLI auto-generates this chained locator — the most complex pattern we've seen"
      columns: ["Name", "Style", "ABV", "IBU", "Status"]
  interaction_pattern: |
    Open: page.getByRole('button', { name: 'Toggle column visibility' }).click()
    Toggle column: page.getByRole('listitem').filter({ hasText: 'Style' }).getByRole('button').click()
    Show all: page.getByRole('button', { name: 'Show All' }).click()
    Close: page.keyboard.press('Escape')
  gotcha: "MUI Popover backdrop intercepts clicks — must Escape to close, cannot click toggle button while panel is open"

brand_detail:
  route: "/brands/:id"
  snapshot_source: "page-2026-02-23T16-28-35-803Z.yml"
  elements:
    page_heading:
      role: "heading"
      level: 4
      name: "{brand_name}"
      locator: "page.getByRole('heading', { level: 4 })"
      notes: "Dynamic — matches brand name. Use level to disambiguate from sub-headings."
    breadcrumbs:
      - role: "link"
        name: "Home"
        url: "/"
        locator: "page.getByRole('link', { name: 'Home' })"
      - role: "link"
        name: "Brands"
        url: "/brands"
        locator: "page.getByRole('link', { name: 'Brands' })"
      - role: "paragraph"
        content: "{brand_name}"
        notes: "Terminal breadcrumb — not a link"
    edit_button:
      role: "button"
      name: "Edit Brand"
      locator: "page.getByRole('button', { name: 'Edit Brand' })"
    delete_button:
      role: "button"
      name: "Delete Brand"
      locator: "page.getByRole('button', { name: 'Delete Brand' })"
    field_labels: ["Name", "Style", "Description", "Target ABV", "Target IBU", "Target SRM", "Status"]
    recipes_section:
      heading:
        role: "heading"
        name: "Recipes"
        level: 6
        locator: "page.getByRole('heading', { name: 'Recipes' })"
      add_recipe_button:
        role: "button"
        name: "Add Recipe"
        locator: "page.getByRole('button', { name: 'Add Recipe' })"
      grid_columns: ["Version", "Batch Size", "Boil Time", "Efficiency", "Est. IBU", "Est. OG", "Status"]
      formula_columns:
        - name: "Est. IBU"
          has_fx_badge: true
        - name: "Est. OG"
          has_fx_badge: true
  data_testids_present: []

brand_delete_dialog:
  description: "Delete Brand confirmation dialog"
  snapshot_source: "page-2026-02-23T16-28-47-080Z.yml"
  elements:
    dialog:
      role: "dialog"
      name: "Delete Brand"
      locator: "page.getByRole('dialog', { name: 'Delete Brand' })"
    title:
      role: "heading"
      name: "Delete Brand"
      level: 2
      locator: "page.getByRole('heading', { name: 'Delete Brand' })"
    confirmation_text:
      role: "paragraph"
      pattern: 'Are you sure you want to delete "{brand_name}"? This action cannot be undone.'
      locator: "page.getByText(/Are you sure you want to delete/)"
    cancel_button:
      role: "button"
      name: "Cancel"
      locator: "page.getByRole('button', { name: 'Cancel' })"
    delete_button:
      role: "button"
      name: "Delete"
      locator: "page.getByRole('button', { name: 'Delete' })"

